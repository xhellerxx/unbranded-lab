services:
  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

  caddy:
    image: caddy:2
    container_name: lab-door
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - mirofish
